<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Wheel</title>
  <style>
    /* Rainbow Pastel Background */
    body {
      background: linear-gradient(135deg, #ffb3ba, #ffdfba, #ffffba, #baffc9, #bae1ff, #e8baff);
      font-family: Tahoma, "MS Sans Serif", sans-serif;
      font-size: 11px;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }

    /* Windows XP Rainbow Luna Window Frame */
    .xp-window {
      background: #ece9d8;
      border: 3px solid #ff4da6;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      width: max-content;
      box-shadow: 4px 4px 10px rgba(255, 77, 166, 0.3);
      overflow: hidden;
    }

    .title-bar {
      background: linear-gradient(90deg, #ffb3ba, #ffdfba, #baffc9, #bae1ff, #e8baff);
      padding: 4px 6px;
      font-weight: bold;
      color: #61334c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 1px 1px #ffffff;
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    .title-buttons {
      display: flex;
      gap: 2px;
    }

    .title-btn {
      width: 16px;
      height: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #fde4f2 50%, #f7c9e3 50%, #f3a6d4 100%);
      border: 1px solid #d96cb8;
      border-radius: 2px;
      font-size: 9px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #61334c;
      cursor: pointer;
    }

    .window-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #ece9d8;
    }

    /* XP Luna Style Button */
    button {
      font-family: "Verdana", monospace;
      font-size: 11px;
      font-weight: normal;
      color: #000000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #d96cb8;
      background: linear-gradient(180deg, #ffffff 0%, #f6f6f6 50%, #fae1ef 50%, #fcecf5 100%);
      transition: none !important;
      animation: none !important;
      box-shadow: inset 0 1px 0 #ffffff;
    }

    button:hover {
      background: linear-gradient(180deg, #fff7d7 0%, #ffeed7 50%, #fadcba 50%, #f7c995 100%);
      border: 1px solid #e39315;
    }

    button:active {
      background: linear-gradient(180deg, #e1e1e1 0%, #cdcdcd 50%, #bcbcbc 50%, #cccccc 100%);
      border: 1px solid #7f7f7f;
      padding: 4px 7px 2px 9px;
    }

    /* Color Wheel & SV Box Container (98x98) */
    .picker-container {
      position: relative;
      width: 98px;
      height: 98px;
      margin: 0 auto;
      background: #f1f1f1;
      border: 1px inset #7f7f7f;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .indicators-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .indicator {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2px;
      filter: drop-shadow(0px 0px 1px #000000);
    }

    .preview-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-preview {
      width: 40px;
      height: 24px;
      border: 1px inset #7f7f7f;
      background-color: #ffb3ba;
    }

    /* 3x3 Grid Square Palette (Exact 24x24 Sized Squares) */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 13px);
      gap: 3px;
      flex: 1;
      justify-content: center;
    }

    .palette-swatch {
      width: 12px;
      height: 12px;
      border: 1px solid #7f7f7f;
      cursor: pointer;
      box-sizing: border-box;
    }

    .palette-swatch:active {
      border: 1px inset #7f7f7f;
    }

    .inputs-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .input-group label {
      font-size: 10px;
      font-weight: bold;
    }

    input[type="text"] {
      font-family: verdana, monospace;
      font-size: 10px;
      padding: 2px 4px;
      border: 1px inset #7f7f7f;
      background: #ffffff;
      color: #000000;
      outline: none;
      text-align: center;
      flex: 1;
    }

    /* Distinct Custom HSV Sliders */
    .sliders-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #fcfcfc;
      padding: 5px;
      border: 1px inset #7f7f7f;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
    }

    .slider-row label {
      width: 10px;
      font-weight: bold;
    }

    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 6px;
      background: #ffffff;
      border: 1px solid #7f7f7f;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 14px;
      border-radius: 1px;
      background: linear-gradient(90deg, #ffffff 0%, #fde4f2 100%);
      border: 1px solid #d96cb8;
      cursor: pointer;
    }
    
    input[type="range"]#h-slider {
  -webkit-appearance: none;
  flex: 1;
  height: 6px;
  border: 1px solid #7f7f7f;
  outline: none;
  background: linear-gradient(
    to right,
    #ff0000 0%,
    #ffff00 17%,
    #00ff00 33%,
    #00ffff 50%,
    #0000ff 67%,
    #ff00ff 83%,
    #ff0000 100%
  );
}

input[type="range"]#h-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px;
  height: 14px;
  border-radius: 1px;
  background: linear-gradient(90deg, #ffffff 0%, #fde4f2 100%);
  border: 1px solid #d96cb8;
  cursor: pointer;
}

input[type="range"]#s-slider {
  -webkit-appearance: none;
  flex: 1;
  height: 6px;
  border: 1px solid #7f7f7f;
  outline: none;
  background: linear-gradient(
    to right,
    #fff 0%,
    red 100%
  );
}

input[type="range"]#s-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px;
  height: 14px;
  border-radius: 1px;
  background: linear-gradient(90deg, #ffffff 0%, #fde4f2 100%);
  border: 1px solid #d96cb8;
  cursor: pointer;
}

input[type="range"]#v-slider {
  -webkit-appearance: none;
  flex: 1;
  height: 6px;
  border: 1px solid #7f7f7f;
  outline: none;
  background: linear-gradient(
    to right,
    #000000 0%,
    #ffffff 100%
  );
}

input[type="range"]#v-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px;
  height: 14px;
  border-radius: 1px;
  background: linear-gradient(90deg, #ffffff 0%, #fde4f2 100%);
  border: 1px solid #d96cb8;
  cursor: pointer;
}
      
  </style>
</head>
<body>

  <div class="xp-window">
    <div class="title-bar">
      <span>‧˚꒰ Color Picker - Wheel ꒱༘‧</span>
      <div class="title-buttons">
        <div class="title-btn">_</div>
        <div class="title-btn">🗖</div>
        <div class="title-btn">✕</div>
      </div>
    </div>

    <div class="window-body">
      <div class="picker-container" id="picker-container">
        <canvas id="wheel-canvas" width="98" height="98"></canvas>
        <canvas id="sv-canvas" width="46" height="46" style="position:absolute; top:26px; left:26px; border:1px solid #7f7f7f;"></canvas>
        
        <svg class="indicators-svg">
          <circle id="wheel-indicator" class="indicator" cx="0" cy="0" r="3" />
          <circle id="sv-indicator" class="indicator" cx="0" cy="0" r="3" />
        </svg>
      </div>

      <div class="preview-row">
        <div id="live-preview" class="live-preview"></div>
        <div class="palette-grid" id="palette-grid"></div>
        <button id="eyedropper-btn" title="Custom Eyedropper">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#61334c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2.5l7 7L9 22H2v-7L14.5 2.5z"/>
            <path d="M12.5 5.5l6 6"/>
          </svg>
        </button>
      </div>

      <div class="inputs-stack">
        <div class="input-group">
          <label>HEX</label>
          <input type="text" id="hex-input" value="#FFB3BA">
          <label>RGBA</label>
          <input type="text" id="rgba-input" value="255, 179, 186, 1">
        </div>
      </div>

      <div class="sliders-stack">
        <div class="slider-row">
          <label>H</label>
          <input type="range" id="h-slider" min="0" max="360" value="355">
        </div>
        <div class="slider-row">
          <label>S</label>
          <input type="range" id="s-slider" min="0" max="100" value="30">
        </div>
        <div class="slider-row">
          <label>V</label>
          <input type="range" id="v-slider" min="0" max="100" value="100">
        </div>
      </div>
    </div>
  </div>

  <script>
    const wheelCanvas = document.getElementById('wheel-canvas');
    const wheelCtx = wheelCanvas.getContext('2d');
    const svCanvas = document.getElementById('sv-canvas');
    const svCtx = svCanvas.getContext('2d');

    const wheelIndicator = document.getElementById('wheel-indicator');
    const svIndicator = document.getElementById('sv-indicator');
    const livePreview = document.getElementById('live-preview');
    const hexInput = document.getElementById('hex-input');
    const rgbaInput = document.getElementById('rgba-input');
    const hSlider = document.getElementById('h-slider');
    const sSlider = document.getElementById('s-slider');
    const vSlider = document.getElementById('v-slider');
    const paletteGrid = document.getElementById('palette-grid');
    const eyedropperBtn = document.getElementById('eyedropper-btn');

    let currentHue = 355;
    let currentSat = 0.3;
    let currentVal = 1.0;

    const size = 98;
    const center = size / 2;
    const outerRadius = 48;
    const innerRadius = 35;

    function drawColorWheel() {
      const imgData = wheelCtx.createImageData(size, size);
      const data = imgData.data;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - center;
          const dy = y - center;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist >= innerRadius && dist <= outerRadius) {
            let angle = Math.atan2(dy, dx) * (180 / Math.PI);
            if (angle < 0) angle += 360;

            const rgb = hsvToRgb(angle, 1, 1);
            const index = (y * size + x) * 4;
            data[index] = rgb.r;
            data[index + 1] = rgb.g;
            data[index + 2] = rgb.b;
            data[index + 3] = 255;
          }
        }
      }
      wheelCtx.putImageData(imgData, 0, 0);
    }

    function drawSVBox() {
      const svSize = 46;
      const imgData = svCtx.createImageData(svSize, svSize);
      const data = imgData.data;

      for (let y = 0; y < svSize; y++) {
        for (let x = 0; x < svSize; x++) {
          const s = x / svSize;
          const v = 1 - (y / svSize);
          const rgb = hsvToRgb(currentHue, s, v);

          const index = (y * svSize + x) * 4;
          data[index] = rgb.r;
          data[index + 1] = rgb.g;
          data[index + 2] = rgb.b;
          data[index + 3] = 255;
        }
      }
      svCtx.putImageData(imgData, 0, 0);
    }

    function hsvToRgb(h, s, v) {
      let r, g, b;
      let i = Math.floor(h / 60) % 6;
      let f = h / 60 - i;
      let p = v * (1 - s);
      let q = v * (1 - f * s);
      let t = v * (1 - (1 - f) * s);

      switch (i) {
        case 0: r = v, g = t, b = p; break;
        case 1: r = q, g = v, b = p; break;
        case 2: r = p, g = v, b = t; break;
        case 3: r = p, g = q, b = v; break;
        case 4: r = t, g = p, b = v; break;
        case 5: r = v, g = p, b = q; break;
      }
      return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function updateColor(updateSliders = true) {
      const rgb = hsvToRgb(currentHue, currentSat, currentVal);
      const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
      const rgbaStr = `${rgb.r}, ${rgb.g}, ${rgb.b}, 1`;

      livePreview.style.backgroundColor = hex;
      hexInput.value = hex;
      rgbaInput.value = rgbaStr;

      if (updateSliders) {
        hSlider.value = Math.round(currentHue);
        sSlider.value = Math.round(currentSat * 100);
        vSlider.value = Math.round(currentVal * 100);
      }

      const wheelRadiusDist = (innerRadius + outerRadius) / 2;
      const rad = currentHue * (Math.PI / 180);
      wheelIndicator.setAttribute('cx', center + wheelRadiusDist * Math.cos(rad));
      wheelIndicator.setAttribute('cy', center + wheelRadiusDist * Math.sin(rad));

      const svSize = 46;
      svIndicator.setAttribute('cx', 26 + (currentSat * svSize));
      svIndicator.setAttribute('cy', 26 + ((1 - currentVal) * svSize));
    }

    const pastelPalette = ["#FFB3BA", "#FFDFBA", "#FFFFBA", "#BAFFC9", "#BAE1FF", "#E8BAFF", "#FFC6FF", "#CAFFBF", "#9BF6FF"];
    function initPalette() {
      paletteGrid.innerHTML = '';
      pastelPalette.forEach(hex => {
        const swatch = document.createElement('div');
        swatch.className = 'palette-swatch';
        swatch.style.backgroundColor = hex;
        swatch.addEventListener('click', () => {
          hexInput.value = hex;
          hexInput.dispatchEvent(new Event('input'));
        });
        paletteGrid.appendChild(swatch);
      });
    }

    let isDraggingWheel = false;
    wheelCanvas.addEventListener('mousedown', (e) => { isDraggingWheel = true; handleWheelMove(e); });
    window.addEventListener('mousemove', (e) => {
      if (isDraggingWheel) handleWheelMove(e);
      if (isDraggingSV) handleSVMove(e);
    });
    window.addEventListener('mouseup', () => { isDraggingWheel = false; isDraggingSV = false; });

    function handleWheelMove(e) {
      const rect = wheelCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left - center;
      const y = e.clientY - rect.top - center;
      let angle = Math.atan2(y, x) * (180 / Math.PI);
      if (angle < 0) angle += 360;
      currentHue = angle;
      drawSVBox();
      updateColor();
    }

    let isDraggingSV = false;
    svCanvas.addEventListener('mousedown', (e) => { isDraggingSV = true; handleSVMove(e); });

    function handleSVMove(e) {
      const rect = svCanvas.getBoundingClientRect();
      const svSize = 46;
      let x = Math.max(0, Math.min(e.clientX - rect.left, svSize));
      let y = Math.max(0, Math.min(e.clientY - rect.top, svSize));
      currentSat = x / svSize;
      currentVal = 1 - (y / svSize);
      updateColor();
    }

    [hSlider, sSlider, vSlider].forEach(slider => {
      slider.addEventListener('input', () => {
        currentHue = parseFloat(hSlider.value);
        currentSat = parseFloat(sSlider.value) / 100;
        currentVal = parseFloat(vSlider.value) / 100;
        drawSVBox();
        updateColor(false);
      });
    });

    hexInput.addEventListener('input', () => {
      let val = hexInput.value.trim();
      if (/^#[0-9A-F]{6}$/i.test(val)) {
        let r = parseInt(val.slice(1,3), 16);
        let g = parseInt(val.slice(3,5), 16);
        let b = parseInt(val.slice(5,7), 16);
        livePreview.style.backgroundColor = val;
        rgbaInput.value = `${r}, ${g}, ${b}, 1`;
      }
    });

    eyedropperBtn.addEventListener('click', async () => {
      if (window.EyeDropper) {
        try {
          const result = await new EyeDropper().open();
          hexInput.value = result.sRGBHex;
          hexInput.dispatchEvent(new Event('input'));
        } catch (e) {}
      } else {
        alert('Eyedropper API is not supported in your browser.');
      }
    });

    drawColorWheel();
    drawSVBox();
    updateColor();
    initPalette();
  </script>
</body>
</html>
